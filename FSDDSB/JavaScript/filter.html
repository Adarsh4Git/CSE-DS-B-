<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // New feature -> egima 6
        const num=[11,22,33,44,55,66,77,88]; //array named num
        const even=num.filter((i)=>(i%2==0));
        const odd=num.filter((i)=>(i%2!=0));

        // Output will be shown in console inside inspect
        console.log("num=", num);
        console.log("Even=",even);
        console.log("Odd=",odd);
    </script>
</body>
</html>
