<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // use ... to copy and merge objects
        const fruit=["Banana", "Papaya", "Kiwi"];
        const vegis=["Tomato", "Pea", "Potato"];
        const fruis = [...fruit, "Milk", ...vegis];
        document.write(fruis);
    </script>
</body>
</html>
