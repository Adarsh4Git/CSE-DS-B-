<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const num=[11,22,33,44,55,66,77,88]; //array named num
        const even=num.filter((i)=>(i%2==0));
        console.log("num=", num);

        // in array mapping is done between index and the array element
        const square=even.map((i)=>(i*i));
        console.log("Even Square=", square);

    </script>
</body>
</html>
